<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taildown Live Editor</title>
  
  <!-- Modern Monospace Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Colors - Professional palette */
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-toolbar: linear-gradient(to bottom, #ffffff, #f8fafc);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      
      /* Accent colors - Modern blue */
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-light: #dbeafe;
      --accent-glow: rgba(59, 130, 246, 0.2);
      
      /* Status colors */
      --success: #047857;
      --success-light: #d1fae5;
      --error: #b91c1c;
      --error-light: #fee2e2;
      --warning: #92400e;
      --warning-light: #fef3c7;
      
      /* Shadows - Layered depth */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      
      /* Typography */
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    }

    /* Dark Mode - Using softer, more readable colors */
    [data-theme="dark"] {
      --bg-primary: #1e1e2e;
      --bg-secondary: #181825;
      --bg-tertiary: #2a2a3a;
      --text-primary: #cdd6f4;
      --text-secondary: #bac2de;
      --text-tertiary: #7f849c;
      --border-color: #45475a;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --accent-light: rgba(137, 180, 250, 0.12);
      --accent-glow: rgba(137, 180, 250, 0.3);
      
      --success: #a6e3a1;
      --success-light: rgba(166, 227, 161, 0.12);
      --error: #f38ba8;
      --error-light: rgba(243, 139, 168, 0.12);
      --warning: #f9e2af;
      --warning-light: rgba(249, 226, 175, 0.12);
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
    }

    /* Dark mode component overrides */
    [data-theme="dark"] #toolbar {
      background: rgba(30, 30, 46, 0.95);
      border-bottom-color: var(--border-color);
    }

    [data-theme="dark"] #slash-menu,
    [data-theme="dark"] #bubble-menu,
    [data-theme="dark"] .cm-tooltip-autocomplete {
      background: var(--bg-tertiary) !important;
      border-color: var(--border-color) !important;
    }

    [data-theme="dark"] .slash-menu-item:hover,
    [data-theme="dark"] .slash-menu-item.selected,
    [data-theme="dark"] .bubble-menu-button:hover,
    [data-theme="dark"] .cm-tooltip-autocomplete > ul > li:hover,
    [data-theme="dark"] .cm-tooltip-autocomplete > ul > li[aria-selected] {
      background: var(--accent-light) !important;
    }

    [data-theme="dark"] .bubble-menu-button:active {
      background: var(--accent) !important;
    }

    [data-theme="dark"] #editor-pane {
      background: var(--bg-primary);
      border-right-color: var(--border-color);
    }

    [data-theme="dark"] .cm-editor {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    [data-theme="dark"] .cm-cursor,
    [data-theme="dark"] .cm-cursor-primary {
      border-left-color: #ffffff !important;
    }
    
    [data-theme="dark"] .cm-content {
      caret-color: #ffffff !important;
    }

    [data-theme="dark"] .cm-gutters {
      background: var(--bg-secondary);
      border-right-color: var(--border-color);
      color: var(--text-tertiary);
    }

    [data-theme="dark"] .cm-activeLineGutter {
      background: var(--accent-light);
      color: var(--accent);
    }

    [data-theme="dark"] .cm-activeLine {
      background: rgba(137, 180, 250, 0.08) !important;
    }

    [data-theme="dark"] #divider {
      background: var(--border-color);
    }

    [data-theme="dark"] #preview-frame {
      background: var(--bg-primary);
    }

    [data-theme="dark"] #loading {
      background: rgba(30, 30, 46, 0.95);
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-secondary);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Toolbar - Premium glass effect */
    #toolbar {
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0;
      min-height: 56px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    #toolbar button {
      position: relative;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 18px;
      min-height: 44px;
      white-space: nowrap;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-sm);
    }

    #toolbar button:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    #toolbar button:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
      background: var(--bg-secondary);
    }

    #toolbar button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #toolbar button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    #toolbar button:disabled:hover {
      background: var(--bg-primary);
      border-color: var(--border-color);
      box-shadow: var(--shadow-sm);
      transform: none;
    }

    /* Help button - styled as icon button */
    #help-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    #help-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent-hover);
    }

    #filename-display {
      max-width: min(20rem, 100%);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
      font-size: 14px;
      margin-left: 4px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      font-weight: 600;
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
      border: 1px solid transparent;
      transition: all var(--transition-base);
    }

    #filename-display:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    #status {
      max-width: 100%;
      overflow-wrap: anywhere;
      margin-left: auto;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 500;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      transition: all var(--transition-base);
      font-family: var(--font-mono);
      letter-spacing: -0.01em;
    }

    #status.success {
      color: var(--success);
      background: var(--success-light);
      border-color: var(--success);
    }

    #status.error {
      color: var(--error);
      background: var(--error-light);
      border-color: var(--error);
    }

    /* Editor container */
    #editor-container {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: var(--bg-secondary);
    }

    #editor-pane {
      flex: 1;
      overflow: auto;
      background: var(--bg-primary);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    #preview-pane {
      flex: 1;
      overflow: hidden;
      background: var(--bg-tertiary);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Draggable divider - Enhanced */
    #divider {
      touch-action: none;
      width: 5px;
      background: var(--border-color);
      cursor: col-resize;
      flex-shrink: 0;
      transition: all var(--transition-fast);
      position: relative;
      z-index: 5;
    }

    #divider::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 3px;
      height: 40px;
      background: var(--border-hover);
      border-radius: 999px;
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    #divider:hover {
      background: var(--accent-light);
    }

    #divider:hover::before {
      opacity: 1;
      background: var(--accent);
    }

    #divider.dragging {
      background: var(--accent);
    }

    #divider.dragging::before {
      opacity: 1;
      background: white;
    }

    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      border-radius: 0;
    }

    /* CodeMirror styling enhancements */
    .cm-editor {
      height: 100%;
      font-size: 15px;
      line-height: 1.8;
      font-family: var(--font-mono);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .cm-scroller {
      overflow: auto;
      font-feature-settings: 'liga' 1, 'calt' 1, 'ss01' 1, 'ss02' 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      padding: 20px 0;
    }

    .cm-content {
      padding: 0 20px;
    }

    .cm-gutters {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      color: var(--text-tertiary);
      padding: 0 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .cm-activeLineGutter {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    .cm-line {
      padding-left: 4px;
    }

    .cm-activeLine {
      background: var(--accent-light) !important;
    }

    .cm-content {
      padding: 16px 0;
    }

    .cm-line {
      padding: 0 16px;
    }

    /* Loading indicator - Premium design */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: var(--shadow-xl);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
    }

    #loading.hidden {
      display: none;
    }

    #loading span {
      font-weight: 600;
    }

    /* Slash Command Menu */
    #command-palette {
      width: min(36rem, calc(100vw - 2rem));
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      color: #111827;
      background: #fff;
      box-shadow: 0 24px 80px #0003;
    }
    #command-palette::backdrop { background: #11182766; }
    #command-palette header { display: flex; align-items: center; gap: 1rem; padding: 1rem; }
    #command-search { flex: 1; min-width: 0; padding: .75rem; font: inherit; color: inherit; background: transparent; border: 1px solid #9ca3af; border-radius: 8px; }
    #command-results { max-height: min(55vh, 28rem); overflow: auto; padding: 0 .5rem .5rem; }
    #command-results .slash-menu-item { border-radius: 8px; }
    #command-palette [role="status"] { padding: 1rem; }
    [data-theme="dark"] #command-palette { background: #1f2937; color: #f9fafb; border-color: #4b5563; }

    #slash-menu {
      position: absolute;
      z-index: 1000;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-xl);
      max-width: 320px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    #slash-menu.active {
      display: block;
    }

    .slash-menu-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      transition: background var(--transition-fast);
    }

    .slash-menu-item:last-child {
      border-bottom: none;
    }

    .slash-menu-item:hover,
    .slash-menu-item.selected {
      background: var(--accent-light);
    }

    .slash-menu-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .slash-menu-content {
      flex: 1;
    }

    .slash-menu-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .slash-menu-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .slash-menu-kbd {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Smart Autocomplete Styling */
    .cm-tooltip-autocomplete {
      background: white !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow-xl) !important;
      padding: 0 !important;
      font-family: var(--font-sans) !important;
      max-height: 400px !important;
      overflow-y: auto !important;
    }

    .cm-tooltip-autocomplete > ul {
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }

    .cm-tooltip-autocomplete > ul > li {
      padding: 10px 14px !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      border-bottom: 1px solid var(--border-color) !important;
      transition: background var(--transition-fast) !important;
      font-size: 14px !important;
    }

    .cm-tooltip-autocomplete > ul > li:last-child {
      border-bottom: none !important;
    }

    .cm-tooltip-autocomplete > ul > li[aria-selected] {
      background: var(--accent-light) !important;
    }

    .cm-tooltip-autocomplete > ul > li:hover {
      background: var(--accent-light) !important;
    }

    /* Autocomplete icon preview */
    .autocomplete-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .autocomplete-label {
      flex: 1;
      font-weight: 500;
      color: var(--text-primary);
    }

    .autocomplete-info {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: auto;
      padding-left: 12px;
    }

    .autocomplete-type {
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    /* Bubble Menu */
    #bubble-menu {
      position: absolute;
      z-index: 1001;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-xl);
      padding: 4px;
      display: none;
      gap: 2px;
    }

    #bubble-menu.active {
      display: flex;
    }

    .bubble-menu-button {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast);
      color: var(--text-primary);
    }

    .bubble-menu-button:hover {
      background: var(--accent-light);
    }

    .bubble-menu-button:active {
      background: var(--accent);
      color: white;
    }

    .bubble-menu-divider {
      width: 1px;
      height: 24px;
      background: var(--border-color);
      margin: 0 4px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--accent-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Smooth fade-in animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #toolbar, #editor-container {
      animation: fadeIn 0.3s ease-out;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 6px;
      border: 3px solid var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    /* Focus styles for accessibility */
    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Responsive: Stack vertically on small screens */
    @media (max-width: 768px) {
      #editor-container {
        flex-direction: column;
      }

      #editor-pane {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      #divider {
        width: 100%;
        height: 5px;
        cursor: row-resize;
      }

      #divider::before {
        width: 40px;
        height: 3px;
      }

      #toolbar {
        flex-wrap: wrap;
        height: auto;
        padding: 12px;
        gap: 8px;
      }

      #toolbar button {
        font-size: 13px;
        padding: 7px 14px;
      }

      #filename-display,
      #status {
        font-size: 12px;
      }
    }

    /* Print styles */
    @media print {
      #toolbar, #editor-pane, #divider {
        display: none !important;
      }
      #preview-pane {
        overflow: visible;
      }
    }

    /* High contrast mode support */
    @media (prefers-contrast: high) {
      :root {
        --border-color: #94a3b8;
        --text-secondary: #475569;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Loading Taildown Editor...</span>
  </div>

  <!-- Slash Command Menu -->
  <div id="slash-menu"></div>
  <dialog id="command-palette" aria-label="Insert a component or format">
    <header>
      <input id="command-search" type="search" placeholder="Search components and formatting…" aria-label="Search commands" role="combobox" aria-autocomplete="list" aria-controls="command-results" aria-expanded="true">
      <button id="command-close" type="button" aria-label="Close commands">Esc</button>
    </header>
    <div id="command-results" role="listbox" aria-label="Commands"></div>
    <div id="command-empty" role="status" hidden>No matching commands.</div>
  </dialog>

  <!-- Bubble Menu -->
  <div id="bubble-menu">
    <button class="bubble-menu-button" data-action="bold" title="Bold (Ctrl+B)"></button>
    <button class="bubble-menu-button" data-action="italic" title="Italic (Ctrl+I)"></button>
    <button class="bubble-menu-button" data-action="code" title="Code"></button>
    <div class="bubble-menu-divider"></div>
    <button class="bubble-menu-button" data-action="heading" title="Heading"></button>
    <button class="bubble-menu-button" data-action="link" title="Link (Ctrl/Cmd+Shift+K)"></button>
  </div>

  <div id="toolbar">
    <button id="new-btn" title="Create new document (Ctrl+N)">New</button>
    <button id="commands-btn" title="Insert a component or format (Ctrl/Cmd+K)">Insert</button>
    <button id="open-btn" title="Open file (Ctrl+O)">Open</button>
    <button id="save-btn" title="Save file (Ctrl+S)">Save</button>
    <button id="download-btn" title="Download .td file">Download</button>
    <button id="export-btn" title="Export HTML (Ctrl+E)">Export HTML</button>
    <button id="help-btn" title="Show welcome template">?</button>
    <button id="theme-toggle-btn" title="Toggle dark mode" style="margin-left: auto;"></button>
    <span id="filename-display">untitled.td</span>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

    function commandEdit(command, from, to, doc, preserveSelection = false) {
      let insert = command.insert;
      let cursor = insert.length + (command.cursorOffset || 0);
      if (preserveSelection && command.wrapSelection && to > from) {
        const selected = doc.sliceString(from, to);
        insert = insert.slice(0, cursor) + selected + insert.slice(cursor);
        cursor += selected.length;
      }
      const block = insert.includes('\n') && !command.wrapSelection || /^(?:#{1,6} |>[ ]|-[ ]|\d+\. )/.test(insert);
      let prefix = '', suffix = '';
      if (block) {
        const before = doc.sliceString(0, from);
        const after = doc.sliceString(to);
        if (before) prefix = '\n'.repeat(Math.max(0, 2 - before.match(/\n*$/)[0].length));
        if (after) suffix = '\n'.repeat(Math.max(0, 2 - after.match(/^\n*/)[0].length));
      }
      return {changes: {from, to, insert: prefix + insert + suffix},
        selection: {anchor: from + prefix.length + cursor}};
    }

    // Helper to render autocomplete items with icons
    function renderAutocompleteItem(label, type, info, iconPreview = null) {
      return (completion) => {

        return container;

    // Smart autocomplete extension
    function taildownAutocomplete(context) {
      const word = context.matchBefore(/[\w-]+/);
      const line = context.state.doc.lineAt(context.pos);
      const textBefore = line.text.slice(0, context.pos - line.from);
      
      // Colon trigger - suggest ::: or inline elements
      if (textBefore.endsWith(':') && !textBefore.endsWith('::')) {
        const colonSuggestions = [
          { 
            label: ':::', 
            insert: '::', 
            info: 'component fence',
            retrigger: true
          },
          { 
            label: ':icon[]', 
            insert: 'icon[]', 
            info: 'inline icon',
            retrigger: true,
            cursorOffset: -1  // Place cursor between brackets
          },
          { 
            label: ':badge[]', 
            insert: 'badge[]', 
            info: 'inline badge',
            cursorOffset: -1  // Place cursor between brackets
          },
          { 
            label: ':kbd[]', 
            insert: 'kbd[]', 
            info: 'keyboard key',
            cursorOffset: -1  // Place cursor between brackets
          }
        ];
        
        return {
          from: context.pos,
          validFor: /^$/,
          options: colonSuggestions.map(item => ({
            label: item.label,
            type: 'keyword',
            info: item.info,
            render: renderAutocompleteItem(item.label, 'keyword', item.info),
            apply: (view, completion, from, to) => {
              const cursorPos = from + item.insert.length + (item.cursorOffset || 0);
              view.dispatch({
                changes: { from, to, insert: item.insert },
                selection: { anchor: cursorPos }
              });
              // Retrigger autocomplete after insertion
              if (item.retrigger) {
                setTimeout(() => {
                  startCompletion(view);
                }, 10);
              }
            }
          }))
        };
      }
      
      // Component autocomplete - triggered after :::
      const componentMatch = textBefore.match(/:::([\w-]*)$/);
      if (componentMatch) {
        return {
          from: context.pos - componentMatch[1].length,
          validFor: /^[\w-]*$/,  // Stay open while typing component names (letters, numbers, dashes)
          options: componentNames.map(name => ({
            label: name,
            type: 'keyword',
            info: 'component',
            render: renderAutocompleteItem(name, 'keyword', 'component'),
            apply: (view, completion, from, to) => {
              // Insert component name, newlines, and closing fence
              const fullInsert = `${name}\n\n:::`;
              const cursorPos = from + name.length + 1; // Position after component name and first newline
              
              view.dispatch({
                changes: { from, to, insert: fullInsert },
                selection: { anchor: cursorPos }
              });
            }
          }))
        };
      }
      
      // Attribute autocomplete - triggered after { or inside {}
      const braceMatch = textBefore.match(/\{([^}]*)$/);
      if (braceMatch) {
        const inline = textBefore.match(/:(icon|badge|kbd)\[[^\]]*\]\{[^}]*$/)?.[1];
        const typed = inline === 'kbd' ? braceMatch[1] : braceMatch[1].match(/[^\s]*$/)[0];
        const component = inline === 'badge' ? 'badge' : textBefore.match(/:::([\w-]+)\s*\{[^}]*$/)?.[1];
        const variants = authoringReference.components.find(item => item.name === component)?.attributes || [];
        const candidates = inline === 'kbd' ? authoringReference.keyboardPlatforms
          : [...styleAttributes, ...variants, ...(inline === 'icon' ? authoringReference.iconSizes : [])];
        const filtered = [...new Set(candidates)].filter(attr =>
          attr.toLowerCase().includes(typed.toLowerCase())
        );
        
        return {
          from: context.pos - typed.length,
          validFor: /^[\w-]*$/,  // Stay open while typing attributes
          options: filtered.map(attr => ({
            label: attr,
            type: 'property',
            info: inline === 'kbd' ? 'platform' : inline ? `${inline}-style` : 'style',
            render: renderAutocompleteItem(attr, 'property', 'style'),
            apply: attr
          }))
        };
      }
      
      // Icon autocomplete - triggered after :icon[
      const iconMatch = textBefore.match(/:icon\[([^\]]*)$/);
      if (iconMatch) {
        const typed = iconMatch[1];
        const filtered = iconNames.filter(icon => 
          icon.toLowerCase().includes(typed.toLowerCase())
        );
        
        return {
          from: context.pos - typed.length,
          validFor: /^[\w-]*$/,  // Stay open while typing icon names
          options: filtered.map(icon => {            
            return {
              label: icon,
              type: 'variable',
              info: 'icon',
              apply: icon
            };
          })
        };
      }
      
      return null;
    }

    // Add icons to bubble menu buttons
    function initBubbleMenu() {
      const buttons = bubbleMenu.querySelectorAll('.bubble-menu-button');

    // Show bubble menu at selection
    function showBubbleMenu() {
      const selection = editor.state.selection.main;
      if (selection.empty || slashMenuActive) {
        hideBubbleMenu();
        return;
      }

      const from = Math.min(selection.from, selection.to);
      const to = Math.max(selection.from, selection.to);
      
      // Get coordinates of the selection
      const startCoords = editor.coordsAtPos(from);
      const endCoords = editor.coordsAtPos(to);
      
      if (!startCoords || !endCoords) {
        hideBubbleMenu();
        return;
      }

      // Position menu above the selection, centered
      const menuWidth = 200; // Approximate width
      const left = (startCoords.left + endCoords.left) / 2 - menuWidth / 2;
      const top = startCoords.top - 45; // 45px above the selection

      bubbleMenu.style.left = `${Math.max(10, left)}px`;
      bubbleMenu.style.top = `${Math.max(10, top)}px`;
      bubbleMenu.classList.add('active');
      bubbleMenuVisible = true;
    }

    // Hide bubble menu
    function hideBubbleMenu() {
      bubbleMenu.classList.remove('active');
      bubbleMenuVisible = false;
    }

    // Handle bubble menu actions
    function handleBubbleAction(action) {
      const selection = editor.state.selection.main;
      if (selection.empty) return;

      const from = Math.min(selection.from, selection.to);
      const to = Math.max(selection.from, selection.to);
      const selectedText = editor.state.doc.sliceString(from, to);

      let replacement;
      let cursorOffset = 0;

      switch (action) {
        case 'bold':
          replacement = `**${selectedText}**`;
          cursorOffset = replacement.length;
          break;
        case 'italic':
          replacement = `*${selectedText}*`;
          cursorOffset = replacement.length;
          break;
        case 'code':
          replacement = `\`${selectedText}\``;
          cursorOffset = replacement.length;
          break;
        case 'heading':
          // Add ## before the selection (or at start of line)
          const line = editor.state.doc.lineAt(from);
          const lineStart = line.from;
          replacement = selectedText;
          editor.dispatch({
            changes: { from: lineStart, to: lineStart, insert: '## ' }
          });
          hideBubbleMenu();
          return;
        case 'link':
          replacement = `[${selectedText}](url)`;
          cursorOffset = replacement.length - 4; // Position cursor at 'url'
          break;
        default:
          return;
      }

      editor.dispatch({
        changes: { from, to, insert: replacement },
        selection: { anchor: from + cursorOffset }
      });
      
      hideBubbleMenu();
    }

    // Bubble menu extension - Show on text selection
    const bubbleMenuExtension = EditorView.updateListener.of((update) => {
      if (update.selectionSet || update.docChanged) {
        // Small delay to let selection settle
        setTimeout(() => {
          const selection = update.view.state.selection.main;
          if (!selection.empty && !slashMenuActive) {
            showBubbleMenu();
          } else {
            hideBubbleMenu();
          }
        }, 50);
      }
    });

    // Syntax highlighting compartment - allows dynamic theme switching
    const syntaxHighlightCompartment = new Compartment();

    // Dark mode toggle functionality
    function initThemeToggle() {
      // Check for saved theme preference or default to light mode
      const savedTheme = draftStore.readTheme();
      setTheme(savedTheme);
      updateThemeButton(savedTheme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      draftStore.saveTheme(theme);
      
      // Update editor syntax highlighting if editor is initialized
      if (editor) {
        editor.dispatch({
          effects: syntaxHighlightCompartment.reconfigure(
            theme === 'dark' ? taildownDarkHighlightStyle : taildownHighlightStyle
          )
        });
      }
    }

    function updateThemeButton(theme) {
      themeToggleBtn.innerHTML = theme === 'dark' 
        ? lucideIcon('sun')  // Show sun icon in dark mode (to switch to light)
        : lucideIcon('moon'); // Show moon icon in light mode (to switch to dark)
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
      updateThemeButton(newTheme);
    }

    // CodeMirror extension for slash commands with keymap priority
    const slashCommandExtension = [
      // High-priority keymap for slash menu navigation (runs before default keymaps)
      Prec.highest(keymap.of([
        {
          key: 'ArrowDown',
          run: (view) => {
            if (slashMenuActive) {
              navigateSlashMenu('down');
              return true;
            }
            return false;
          }
        },
        {
          key: 'ArrowUp',
          run: (view) => {
            if (slashMenuActive) {
              navigateSlashMenu('up');
              return true;
            }
            return false;
          }
        },
        {
          key: 'Tab',
          run: (view) => {
            if (slashMenuActive) {
              executeSelectedCommand();
              return true;
            }
            return false;
          }
        },
        {
          key: 'Escape',
          run: (view) => {
            if (slashMenuActive) {
              hideSlashMenu();
              return true;
            }
            return false;
          }
        }
      ])),
      // DOM event handlers for slash detection and filtering
      EditorView.domEventHandlers({
        keydown(event, view) {
          // Detect slash key at start of line or after space
          if (event.key === '/' && !slashMenuActive) {
            const pos = view.state.selection.main.head;
            const line = view.state.doc.lineAt(pos);
            const textBefore = line.text.slice(0, pos - line.from);
            
            // Only trigger if at start of line or after whitespace
            if (textBefore.trim() === '' || /\s$/.test(textBefore)) {
              slashMenuStart = pos;
              // Wait for next frame to show menu after "/" is inserted
              setTimeout(() => showSlashMenu(''), 0);
            }
          }
          return false;
        },
        
        input(event, view) {
          // Update slash menu with search text
          if (slashMenuActive && slashMenuStart !== null) {
            const pos = view.state.selection.main.head;
            const searchText = view.state.doc.sliceString(slashMenuStart + 1, pos);
            
            // Hide menu if user deletes the "/"
            if (pos <= slashMenuStart) {
              hideSlashMenu();
            } else {
              showSlashMenu(searchText);
            }
          }
          return false;
        }
      })
    ];

    // Initialize editor
    function initEditor() {
      try {
        // Get saved theme to determine initial syntax highlighting
        const savedTheme = draftStore.readTheme();
        const initialHighlightStyle = savedTheme === 'dark' ? taildownDarkHighlightStyle : taildownHighlightStyle;

        // Create editor with theme-aware syntax highlighting
        editor = new EditorView({
          doc: DEFAULT_TEMPLATE,
          extensions: [
            lineNumbers(),
            highlightActiveLineGutter(),
            history(),
            foldGutter(),
            indentOnInput(),
            bracketMatching(),
            closeBrackets(),
            autocompletion({
              override: [taildownAutocomplete],
              activateOnTyping: true,
              maxRenderedOptions: 10,
              closeOnBlur: true,
              icons: false,  // We're using custom rendering
              addToOptions: [{position: 20, render: renderIconCompletion}],
              defaultKeymap: false  // Disable default keymap (includes Enter)
            }),
            highlightSelectionMatches(),
            taildown(),
            syntaxHighlightCompartment.of(initialHighlightStyle), // Theme-aware syntax highlighting
            slashCommandExtension, // Slash command menu
            bubbleMenuExtension, // Bubble menu for text selection
            // Custom autocomplete keybindings (Tab only, no Enter)
            Prec.highest(keymap.of([
              { key: 'Ctrl-Space', run: startCompletion },
              {
                key: 'Tab',
                run: acceptCompletion  // Accept completion
              },
              {
                key: 'Tab',
                run: indentWithTab.run  // If no completion, indent
              },
              {
                key: 'ArrowDown',
                run: moveCompletionSelection(true)  // Navigate down in autocomplete
              },
              {
                key: 'ArrowUp',
                run: moveCompletionSelection(false)  // Navigate up in autocomplete
              },
              {
                key: 'Escape',
                run: closeCompletion  // Close autocomplete menu
              }
            ])),
            keymap.of([
              ...defaultKeymap,
              ...historyKeymap,
              ...foldKeymap,
              ...closeBracketsKeymap,
              ...searchKeymap,
              ...lintKeymap,
              // Custom keybindings
              { key: 'Ctrl-s', run: () => { saveFile(); return true; } },
              { key: 'Cmd-s', run: () => { saveFile(); return true; } },
              { key: 'Ctrl-o', run: () => { openFile(); return true; } },
              { key: 'Cmd-o', run: () => { openFile(); return true; } },
              { key: 'Ctrl-e', run: () => { exportHTML(); return true; } },
              { key: 'Cmd-e', run: () => { exportHTML(); return true; } },
              { key: 'Ctrl-n', run: () => { newDocument(); return true; } },
              { key: 'Cmd-n', run: () => { newDocument(); return true; } },
              // Formatting shortcuts
              { key: 'Ctrl-b', run: () => { handleBubbleAction('bold'); return true; } },
              { key: 'Cmd-b', run: () => { handleBubbleAction('bold'); return true; } },
              { key: 'Ctrl-i', run: () => { handleBubbleAction('italic'); return true; } },
              { key: 'Cmd-i', run: () => { handleBubbleAction('italic'); return true; } },
              { key: 'Mod-k', run: openCommandPalette },
              { key: 'Mod-Shift-k', run: () => { handleBubbleAction('link'); return true; } },
            ]),
            EditorView.updateListener.of((update) => {
              if (update.docChanged) {
                scheduleUpdate();
              }
            }),
          ],
          parent: editorPane,
        });

        // Initialize bubble menu
        initBubbleMenu();

        // Add bubble menu event listeners
        bubbleMenu.addEventListener('click', (e) => {
          const button = e.target.closest('.bubble-menu-button');
          if (button) {
            const action = button.dataset.action;
            handleBubbleAction(action);
          }
        });

        // Initialize theme toggle
        initThemeToggle();

        // Add theme toggle event listener
        themeToggleBtn.addEventListener('click', toggleTheme);

        // Try to restore the browser draft
        const saved = draftStore.load();
        if (saved !== null) {
          editor.dispatch({
            changes: { from: 0, to: editor.state.doc.length, insert: saved.content }
          });
          if (saved.filename) {
            currentFilename = saved.filename;
            filenameDisplay.textContent = filenameDisplay.title = currentFilename;
          }
          // The editor's update listener will trigger updatePreview, so don't call it here
        } else {
          // Only call updatePreview if no saved content (template is already in editor)
          updatePreview(editor.state.doc.toString());
        }

        // Hide loading indicator
        loading.classList.add('hidden');

        console.log('✓ Taildown Editor initialized');
      } catch (error) {
        console.error('Failed to initialize editor:', error);
        loading.innerHTML = `<div style="color: var(--error)">Failed to load editor: ${error.message}</div>`;
      }
    }

    let previewRevision = 0;
    // Schedule preview updates and autosave after typing pauses.
    function scheduleUpdate() {
      previewRevision++; // Invalidate pending results before the debounce expires.
      document.getElementById('diagnostics').hidden = true;
      clearTimeout(updateTimeout);
      updateTimeout = setTimeout(() => {
        const content = editor.state.doc.toString();
        updatePreview(content);
        draftStore.save(content, currentFilename);
      }, 1000);
    }
    async function updatePreview(source) {
      const revision = ++previewRevision;
      try {
        const startTime = performance.now();
        
        // Save scroll position before updating
        let savedScrollTop = 0;
        let savedScrollLeft = 0;
        try {
          const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
          if (previewDoc && previewDoc.documentElement) {
            savedScrollTop = previewDoc.documentElement.scrollTop || previewDoc.body.scrollTop || 0;
            savedScrollLeft = previewDoc.documentElement.scrollLeft || previewDoc.body.scrollLeft || 0;
          }
        } catch (e) {
          // Ignore if iframe not accessible yet
        }
        
        const result = await compile(source, {
          inlineStyles: true,
          inlineScripts: true,
          darkMode: true,
        });
        if (revision !== previewRevision) return;
        const compileTime = performance.now() - startTime;

        // Function to restore scroll position
        const restoreScroll = () => {
          if (revision !== previewRevision) return;
          try {
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            if (previewDoc && previewDoc.documentElement) {
              previewDoc.documentElement.scrollTop = savedScrollTop;
              previewDoc.body.scrollTop = savedScrollTop;
              previewDoc.documentElement.scrollLeft = savedScrollLeft;
              previewDoc.body.scrollLeft = savedScrollLeft;
            }
          } catch (e) {
            // Ignore if iframe not accessible
          }
        };

        previewFrame.srcdoc = result.html;
        statusBar.textContent = `✓ Compiled in ${compileTime.toFixed(0)}ms`;
        const warnings = result.metadata.warnings;
        const diagnostics = document.getElementById('diagnostics');
        diagnostics.hidden = warnings.length === 0;
        diagnostics.querySelector('summary').textContent = `${warnings.length} compilation notice${warnings.length === 1 ? '' : 's'}`;
        diagnostics.querySelector('ul').replaceChildren(...warnings.map(warning => {
          const item = document.createElement('li');
          item.textContent = `${warning.line ? `Line ${warning.line}: ` : ''}${warning.message}`;
          return item;
        }));
        statusBar.className = 'success';
        
        previewFrame.addEventListener('load', restoreScroll, { once: true });
      } catch (error) {
        if (revision !== previewRevision) return;
        document.getElementById('diagnostics').hidden = true;
        statusBar.textContent = `✗ Error: ${error.message}`;
        statusBar.className = 'error';
        console.error('Compilation error:', error);
      }
    }

    // New document
    function newDocument() {
      if (confirm('Create new document? Any unsaved changes will be lost.')) {
        documentVersion++;
        // Start with a truly blank document
        const blankContent = '# New Document\n\n';
        editor.dispatch({
          changes: { from: 0, to: editor.state.doc.length, insert: blankContent }
        });
        currentFilename = 'untitled.td';
        currentFileHandle = null;
        filenameDisplay.textContent = filenameDisplay.title = currentFilename;
        draftStore.save(blankContent, currentFilename);
      }
    }

    // Show welcome template
    function showTemplate() {
      const currentContent = editor.state.doc.toString();
      const hasContent = currentContent.trim().length > 0 && currentContent !== '# New Document\n\n';
      
      if (hasContent && !confirm('Load welcome template? Any unsaved changes will be lost.')) {
        return;
      }
      documentVersion++;
      
      editor.dispatch({
        changes: { from: 0, to: editor.state.doc.length, insert: DEFAULT_TEMPLATE }
      });
      currentFilename = 'welcome.td';
      currentFileHandle = null;
      filenameDisplay.textContent = filenameDisplay.title = currentFilename;
      // Don't clear localStorage - this is just a preview
    }

    // Open file
    async function openFile() {
      const version = documentVersion;
      const requestVersion = ++openRequestVersion;
      const originalDocument = editor.state.doc;
      const acceptFile = async (file, fileHandle = null) => {
        try {
          const content = await file.text();
          if (version !== documentVersion || requestVersion !== openRequestVersion) return;
          if (editor.state.doc !== originalDocument) {
            statusBar.textContent = 'File not opened: the document changed while opening. Try again.';
            statusBar.className = 'error';
            return;
          }
          documentVersion++;
          currentFileHandle = fileHandle;
          currentFilename = file.name;
          filenameDisplay.textContent = filenameDisplay.title = currentFilename;
          editor.dispatch({changes: {from: 0, to: editor.state.doc.length, insert: content}});
          statusBar.textContent = `✓ Opened ${currentFilename}`;
          statusBar.className = 'success';
        } catch (error) {
          if (version !== documentVersion || requestVersion !== openRequestVersion) return;
          statusBar.textContent = `✗ Error opening file: ${error.message}`;
          statusBar.className = 'error';
        }
      };
      try {
        if ('showOpenFilePicker' in window) {
          // Modern File System API
          const [fileHandle] = await window.showOpenFilePicker({
            types: [{
              description: 'Taildown Files',
              accept: { 'text/plain': ['.td', '.tdown', '.taildown'] }
            }],
            multiple: false
          });
          const file = await fileHandle.getFile();
          await acceptFile(file, fileHandle);
        } else {
          // Fallback: traditional file input
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = '.td,.tdown,.taildown';
          input.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
              await acceptFile(file);
            }
          };
          input.click();
        }
      } catch (error) {
        if (version !== documentVersion || requestVersion !== openRequestVersion) return;
        if (error.name !== 'AbortError') {
          statusBar.textContent = `✗ Error opening file: ${error.message}`;
          statusBar.className = 'error';
          console.error('Error opening file:', error);
        }
      }
    }

    // Save file
    async function writeFileSnapshot(fileHandle, content) {
      const previous = pendingFileWrites.get(fileHandle) || Promise.resolve();
      const pending = previous.catch(() => {}).then(async () => {
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
      });
      pendingFileWrites.set(fileHandle, pending);
      try {
        await pending;
      } finally {
        if (pendingFileWrites.get(fileHandle) === pending) pendingFileWrites.delete(fileHandle);
      }
    }

    async function saveFile() {
      const version = documentVersion;
      const filename = currentFilename;
      const existingHandle = currentFileHandle;
      try {
        const content = editor.state.doc.toString();
        
        if (existingHandle && 'createWritable' in existingHandle) {
          // File System API save
          await writeFileSnapshot(existingHandle, content);
          if (version !== documentVersion) return;
          statusBar.textContent = `✓ Saved ${currentFilename}`;
          statusBar.className = 'success';
        } else if ('showSaveFilePicker' in window) {
          // Show save dialog
          const fileHandle = await window.showSaveFilePicker({
            types: [{
              description: 'Taildown Files',
              accept: { 'text/plain': ['.td'] }
            }],
            suggestedName: filename
          });
          if (version !== documentVersion) return;
          await writeFileSnapshot(fileHandle, content);
          if (version !== documentVersion) return;
          currentFileHandle = fileHandle;
          currentFilename = fileHandle.name;
          filenameDisplay.textContent = filenameDisplay.title = currentFilename;
          statusBar.textContent = `✓ Saved ${currentFilename}`;
          statusBar.className = 'success';
        } else {
          // Fallback: download
          downloadFile(content, filename);
        }
        
        // Browser recovery failure must not turn a successful file write into an error.
        draftStore.save(editor.state.doc.toString(), currentFilename);
        if (content !== editor.state.doc.toString()) statusBar.textContent += ' (newer edits remain)';
      } catch (error) {
        if (version !== documentVersion) return;
        if (error.name !== 'AbortError') {
          statusBar.textContent = `✗ Error saving: ${error.message}`;
          statusBar.className = 'error';
          console.error('Error saving file:', error);
        }
      }
    }

    // Download file
    function downloadFile(content, filename, mimeType = 'text/plain;charset=utf-8') {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      statusBar.textContent = `✓ Downloaded ${filename}`;
      statusBar.className = 'success';
    }

    // Export HTML
    async function exportHTML() {
      const filename = currentFilename;
      try {
        const source = editor.state.doc.toString();
        
        
        const result = await compile(source, {
          inlineStyles: true,
          inlineScripts: true,
          darkMode: true,
        });
        
        const htmlFilename = /\.(?:td|tdown|taildown)$/i.test(filename)
          ? filename.replace(/\.(?:td|tdown|taildown)$/i, '.html') : filename + '.html';
        downloadFile(result.html, htmlFilename, 'text/html;charset=utf-8');
        statusBar.textContent = `✓ Exported ${htmlFilename}`;
        statusBar.className = 'success';
      } catch (error) {
        statusBar.textContent = `✗ Export failed: ${error.message}`;
        statusBar.className = 'error';
        console.error('Export error:', error);
      }
    }

    // Draggable divider
    const paneContainer = document.getElementById('editor-container');
    let activeDrag = null;
    const stackedPanes = () => window.innerWidth <= 768;
    const editorPercent = () => {
      const axis = stackedPanes() ? 'height' : 'width';
      const size = paneContainer.getBoundingClientRect()[axis];
      return size ? editorPane.getBoundingClientRect()[axis] / size * 100 : 50;
    };
    const resizeEditor = value => {
      const percent = Math.min(85, Math.max(15, value));
      editorPane.style.flex = `0 0 ${percent}%`;
      divider.setAttribute('aria-valuenow', String(Math.round(percent)));
      divider.setAttribute('aria-valuetext', `${Math.round(percent)}% editor`);
    };
    const finishResize = () => {
      if (!activeDrag) return;
      const previous = activeDrag;
      activeDrag = null;
      divider.classList.remove('dragging');
      previewFrame.style.pointerEvents = previous.pointerEvents;
      document.body.style.userSelect = previous.userSelect;
      document.body.style.cursor = previous.cursor;
      if (divider.hasPointerCapture(previous.id)) divider.releasePointerCapture(previous.id);
    };
    const updateDivider = () => {
      finishResize();
      divider.setAttribute('aria-orientation', stackedPanes() ? 'horizontal' : 'vertical');
      divider.setAttribute('aria-valuenow', String(Math.round(editorPercent())));
      divider.setAttribute('aria-valuetext', `${Math.round(editorPercent())}% editor`);
    };
    divider.addEventListener('pointerdown', e => {
      if (activeDrag || !e.isPrimary || e.button !== 0) return;
      const stacked = stackedPanes();
      const size = paneContainer.getBoundingClientRect()[stacked ? 'height' : 'width'];
      if (!size) return;
      activeDrag = {id: e.pointerId, stacked, size, start: stacked ? e.clientY : e.clientX,
        percent: editorPercent(), pointerEvents: previewFrame.style.pointerEvents,
        userSelect: document.body.style.userSelect, cursor: document.body.style.cursor};
      divider.setPointerCapture(e.pointerId);
      divider.classList.add('dragging');
      divider.focus();
      previewFrame.style.pointerEvents = 'none';
      document.body.style.userSelect = 'none';
      document.body.style.cursor = stacked ? 'row-resize' : 'col-resize';
      e.preventDefault();
    });
    document.addEventListener('pointermove', e => {
      if (!activeDrag || e.pointerId !== activeDrag.id) return;
      const position = activeDrag.stacked ? e.clientY : e.clientX;
      resizeEditor(activeDrag.percent + (position - activeDrag.start) / activeDrag.size * 100);
      e.preventDefault();
    });
    for (const event of ['pointerup', 'pointercancel']) document.addEventListener(event, e => {
      if (activeDrag?.id === e.pointerId) finishResize();
    });
    divider.addEventListener('lostpointercapture', finishResize);
    window.addEventListener('blur', finishResize);
    window.addEventListener('resize', updateDivider);
    divider.addEventListener('keydown', e => {
      const backward = stackedPanes() ? 'ArrowUp' : 'ArrowLeft';
      const forward = stackedPanes() ? 'ArrowDown' : 'ArrowRight';
      if (![backward, forward, 'Home', 'End'].includes(e.key)) return;
      finishResize();
      const step = e.shiftKey ? 10 : 2;
      resizeEditor(e.key === 'Home' ? 15 : e.key === 'End' ? 85 : editorPercent() + (e.key === forward ? step : -step));
      e.preventDefault();
    });
    updateDivider();
    // Button event listeners
    newBtn.addEventListener('click', newDocument);
    openBtn.addEventListener('click', openFile);
    saveBtn.addEventListener('click', saveFile);
    downloadBtn.addEventListener('click', () => {
      const content = editor.state.doc.toString();
      downloadFile(content, currentFilename);
    });
    exportBtn.addEventListener('click', exportHTML);
    helpBtn.addEventListener('click', showTemplate);

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initEditor);
    } else {
      initEditor();
    }

    // Warn before closing with unsaved changes
    window.addEventListener('beforeunload', (e) => {
      const current = editor?.state.doc.toString();
      if (current !== undefined && !draftStore.isSaved(current, currentFilename)) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  </script>
</body>
</html>
